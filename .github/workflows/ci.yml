name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
          - os: macos-latest
            node: '24'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Require issue-linked PR
        run: node scripts/check-pr.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev
      - name: Validate deployment script syntax
        run: node --check scripts/deploy.mjs
# Deliberately no self-hosted runner, secrets, or deployment on PR events.
# Deployment is a local operator action on merged main with successful checks.
